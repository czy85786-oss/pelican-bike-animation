<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(180deg, #87CEEB 0%, #B0E0E6 60%, #98D8C8 100%);
    overflow: hidden;
    font-family: sans-serif;
  }
  .scene {
    width: 900px;
    height: 500px;
    position: relative;
  }
  svg {
    width: 100%;
    height: 100%;
  }

  /* 云朵飘动 */
  .cloud {
    animation: cloudMove 20s linear infinite;
  }
  .cloud2 {
    animation: cloudMove 30s linear infinite;
    animation-delay: -10s;
  }
  .cloud3 {
    animation: cloudMove 25s linear infinite;
    animation-delay: -5s;
  }
  @keyframes cloudMove {
    from { transform: translateX(950px); }
    to   { transform: translateX(-200px); }
  }

  /* 太阳光芒旋转 */
  .sun-rays {
    transform-origin: 120px 90px;
    animation: sunSpin 30s linear infinite;
  }
  @keyframes sunSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* 地面纹理滚动 */
  .ground-pattern {
    animation: groundScroll 2s linear infinite;
  }
  @keyframes groundScroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-80px); }
  }

  /* 自行车整体前进（轻微上下浮动模拟骑行颠簸） */
  .bike-group {
    animation: bikeBounce 0.5s ease-in-out infinite alternate;
    transform-origin: center bottom;
  }
  @keyframes bikeBounce {
    from { transform: translateY(0); }
    to   { transform: translateY(-4px); }
  }

  /* 车轮旋转 */
  .wheel {
    transform-origin: center;
    animation: wheelSpin 0.6s linear infinite;
  }
  .wheel-front { transform-origin: 590px 370px; }
  .wheel-back  { transform-origin: 340px 370px; }
  @keyframes wheelSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* 踏板曲柄旋转 */
  .crank {
    transform-origin: 465px 370px;
    animation: wheelSpin 0.6s linear infinite;
  }

  /* 鹈鹕腿部跟随踏板 */
  .leg-front {
    transform-origin: 430px 310px;
    animation: legFront 0.6s linear infinite;
  }
  .leg-back {
    transform-origin: 430px 310px;
    animation: legBack 0.6s linear infinite;
  }
  @keyframes legFront {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  @keyframes legBack {
    0%   { transform: rotate(180deg); }
    100% { transform: rotate(540deg); }
  }

  /* 鹈鹕身体呼吸/浮动 */
  .pelican-body {
    animation: bodyFloat 1s ease-in-out infinite alternate;
    transform-origin: 430px 280px;
  }
  @keyframes bodyFloat {
    from { transform: translateY(0) rotate(-1deg); }
    to   { transform: translateY(-3px) rotate(1deg); }
  }

  /* 翅膀扇动 */
  .wing {
    transform-origin: 400px 260px;
    animation: wingFlap 0.8s ease-in-out infinite alternate;
  }
  @keyframes wingFlap {
    from { transform: rotate(-5deg); }
    to   { transform: rotate(15deg); }
  }

  /* 头部点头 */
  .head {
    transform-origin: 445px 220px;
    animation: headNod 1.2s ease-in-out infinite alternate;
  }
  @keyframes headNod {
    from { transform: rotate(-3deg); }
    to   { transform: rotate(5deg); }
  }

  /* 嘴巴开合 */
  .beak-lower {
    transform-origin: 470px 235px;
    animation: beakOpen 1.5s ease-in-out infinite;
  }
  @keyframes beakOpen {
    0%, 60%, 100% { transform: rotate(0deg); }
    75% { transform: rotate(8deg); }
    85% { transform: rotate(8deg); }
  }

  /* 小草摇摆 */
  .grass {
    transform-origin: bottom center;
    animation: grassSway 2s ease-in-out infinite alternate;
  }
  @keyframes grassSway {
    from { transform: rotate(-3deg); }
    to   { transform: rotate(3deg); }
  }

  /* 标题 */
  .title {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 28px;
    font-weight: bold;
    color: #fff;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    letter-spacing: 4px;
    z-index: 10;
  }
</style>
</head>
<body>
<div class="scene">
  <div class="title">鹈鹕骑自行车 🚲</div>
  <svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
    <defs>

      <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#A0A0A0"/>
        <stop offset="100%" style="stop-color:#808080"/>
      </linearGradient>
      <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#FFFFFF"/>
        <stop offset="100%" style="stop-color:#E8E8E8"/>
      </linearGradient>
      <linearGradient id="beakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#FFB347"/>
        <stop offset="100%" style="stop-color:#FF8C00"/>
      </linearGradient>
      <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#FFDAB9"/>
        <stop offset="100%" style="stop-color:#FFA07A"/>
      </linearGradient>
      <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">

        <stop offset="100%" style="stop-color:#FFA500"/>
      </radialGradient>
      <radialGradient id="cloudGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" style="stop-color:#FFFFFF"/>
        <stop offset="100%" style="stop-color:#F0F0F0"/>
      </radialGradient>
    </defs>

    <g class="sun-rays">

    <circle cx="120" cy="90" r="35" fill="url(#sunGrad)"/>

    <g class="cloud" opacity="0.9">

    </g>
    <g class="cloud2" opacity="0.8" transform="translate(0,60)">

      <ellipse cx="0" cy="0" rx="30" ry="18" fill="url(#cloudGrad)"/>

    <path d="M0 350 L150 250 L300 320 L450 230 L600 310 L750 260 L900 340 L900 400 L0 400 Z" fill="#6B8E6B" opacity="0.4"/>
    <path d="M0 370 L100 300 L250 350 L400 280 L550 340 L700 290 L850 350 L900 330 L900 400 L0 400 Z" fill="#5A7D5A" opacity="0.5"/>

    <rect x="0" y="390" width="900" height="110" fill="url(#groundGrad)"/>
    <rect x="0" y="395" width="900" height="35" fill="url(#roadGrad)"/>
    <g class="ground-pattern">
      <rect x="0" y="410" width="40" height="5" fill="#FFF" rx="2"/>
      <rect x="80" y="410" width="40" height="5" fill="#FFF" rx="2"/>

      <rect x="320" y="410" width="40" height="5" fill="#FFF" rx="2"/>

      <rect x="880" y="410" width="40" height="5" fill="#FFF" rx="2"/>
      <rect x="960" y="410" width="40" height="5" fill="#FFF" rx="2"/>
    </g>

    <g class="grass" transform="translate(50,390)">
      <path d="M0 0 Q-3 -15 -8 -25 M0 0 Q0 -18 2 -30 M0 0 Q5 -14 10 -22" stroke="#4A9B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>

    </g>
    <g class="grass" transform="translate(750,390)">

    </g>

    <g transform="translate(820,383)">

    <g class="bike-group">
      <g class="wheel wheel-back">

          <line x1="370" y1="340" x2="310" y2="400"/>
          <line x1="325" y1="332" x2="355" y2="408"/>
          <line x1="355" y1="332" x2="325" y2="408"/>
        </g>
        <circle cx="340" cy="370" r="6" fill="#333"/>
        <circle cx="340" cy="370" r="3" fill="#666"/>
      </g>

      <g class="wheel wheel-front">
        <circle cx="590" cy="370" r="48" fill="none" stroke="#333" stroke-width="5"/>
        <circle cx="590" cy="370" r="42" fill="none" stroke="#555" stroke-width="2"/>
        <g stroke="#888" stroke-width="1.5">
          <line x1="590" y1="328" x2="590" y2="412"/>
          <line x1="548" y1="370" x2="632" y2="370"/>
          <line x1="560" y1="340" x2="620" y2="400"/>
          <line x1="620" y1="340" x2="560" y2="400"/>
          <line x1="575" y1="332" x2="605" y2="408"/>
          <line x1="605" y1="332" x2="575" y2="408"/>
        </g>
        <circle cx="590" cy="370" r="6" fill="#333"/>
        <circle cx="590" cy="370" r="3" fill="#666"/>
      </g>

      <g stroke="#E63946" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="465" y1="370" x2="555" y2="310"/>
        <line x1="430" y1="300" x2="555" y2="310"/>
        <line x1="430" y1="300" x2="465" y2="370"/>
        <line x1="465" y1="370" x2="340" y2="370"/>
        <line x1="430" y1="300" x2="340" y2="370"/>
        <line x1="555" y1="310" x2="590" y2="370"/>
      </g>

      <g stroke="#333" stroke-width="5" fill="none" stroke-linecap="round">
        <line x1="555" y1="310" x2="560" y2="285"/>
        <line x1="545" y1="282" x2="575" y2="282"/>
      </g>
      <circle cx="545" cy="282" r="4" fill="#222"/>
      <circle cx="575" cy="282" r="4" fill="#222"/>

      <ellipse cx="425" cy="295" rx="22" ry="7" fill="#222"/>
      <ellipse cx="425" cy="293" rx="18" ry="4" fill="#444"/>

      <g class="crank">
        <line x1="465" y1="370" x2="465" y2="395" stroke="#444" stroke-width="4" stroke-linecap="round"/>
        <rect x="458" y="393" width="14" height="6" rx="2" fill="#333"/>

      <circle cx="465" cy="370" r="8" fill="#555"/>
      <circle cx="465" cy="370" r="4" fill="#333"/>

      <ellipse cx="402" cy="370" rx="63" ry="8" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="4,2"/>

        <g class="leg-back">

    <g stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.5">

      <line x1="260" y1="390" x2="300" y2="390">
        <animate attributeName="opacity" values="0;0.6;0" dur="0.7s" repeatCount="indefinite"/>

    <g fill="#FFF" opacity="0.8">
      <text x="580" y="180" font-size="24">♪

        <animate attributeName="y" values="160;140;160" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.3s" repeatCount="indefinite"/>
      </text>
    </g>
  </svg>
</div>
</body>
</html>
